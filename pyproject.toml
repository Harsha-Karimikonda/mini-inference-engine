[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-together"
version = "0.1.0"
description = "A small, observable, fault-tolerant LLM inference control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "httpx>=0.26",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
gpu = ["torch>=2.2", "transformers>=4.40", "accelerate>=0.28"]
grpc = ["grpcio>=1.62", "grpcio-tools>=1.62", "protobuf>=4.25"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
benchmark = "mini_inference_engine.benchmarks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
